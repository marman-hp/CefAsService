<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Inter, Arial, sans-serif">
  <rect width="960" height="470" rx="14" fill="#0a0a0a"/>
  <text x="32" y="44" fill="#e5e5e5" font-size="20" font-weight="600">Isolation: who shares cookies, logins and cache</text>
  <text x="32" y="68" fill="#8a94a3" font-size="13">A browser context = one profile folder (cookies, logins, localStorage, cache).</text>

  <!-- Per tenant -->
  <rect x="32" y="92" width="430" height="350" rx="12" fill="#111111" stroke="#262626"/>
  <text x="52" y="122" fill="#e5e5e5" font-size="16" font-weight="600">Per tenant (default)</text>
  <text x="52" y="144" fill="#a3a3a3" font-size="12.5">All tabs of one viewer share one context.</text>

  <rect x="52" y="168" width="390" height="190" rx="10" fill="#171717" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="194" fill="#3b82f6" font-size="13" font-weight="600">Context of tenant A</text>
  <rect x="70" y="210" width="110" height="34" rx="7" fill="#202020" stroke="#404040"/>
  <text x="84" y="232" fill="#e5e5e5" font-size="13">Tab: mail</text>
  <rect x="192" y="210" width="110" height="34" rx="7" fill="#202020" stroke="#404040"/>
  <text x="206" y="232" fill="#e5e5e5" font-size="13">Tab: shop</text>
  <rect x="314" y="210" width="110" height="34" rx="7" fill="#202020" stroke="#404040"/>
  <text x="328" y="232" fill="#e5e5e5" font-size="13">Tab: chat</text>
  <text x="70" y="280" fill="#a3a3a3" font-size="12.5">Log in once - every tab of this tenant is logged in.</text>
  <text x="70" y="302" fill="#a3a3a3" font-size="12.5">One account per site per tenant.</text>
  <text x="70" y="336" fill="#737373" font-size="12">Folder: one per tenant</text>

  <rect x="52" y="374" width="390" height="48" rx="10" fill="#141414" stroke="#262626" stroke-dasharray="4 4"/>
  <text x="70" y="403" fill="#737373" font-size="12.5">Tenant B has its own context - nothing shared.</text>

  <!-- Per session -->
  <rect x="498" y="92" width="430" height="350" rx="12" fill="#111111" stroke="#262626"/>
  <text x="518" y="122" fill="#e5e5e5" font-size="16" font-weight="600">Per session (--isolation-mode-session)</text>
  <text x="518" y="144" fill="#a3a3a3" font-size="12.5">Every tab made with "+" gets its own context.</text>

  <!-- context 1 -->
  <rect x="518" y="168" width="190" height="150" rx="10" fill="#171717" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="534" y="182" width="22" height="18" rx="4" fill="#ef4444"/>
  <text x="541" y="196" fill="#ffffff" font-size="12" font-weight="700">1</text>
  <text x="564" y="196" fill="#3b82f6" font-size="13" font-weight="600">Context 1</text>
  <rect x="534" y="212" width="158" height="30" rx="7" fill="#202020" stroke="#404040"/>
  <text x="548" y="232" fill="#e5e5e5" font-size="12.5">Tab: account A</text>
  <rect x="550" y="252" width="142" height="30" rx="7" fill="#202020" stroke="#404040" stroke-dasharray="3 3"/>
  <text x="562" y="272" fill="#a3a3a3" font-size="12">popup / new tab</text>
  <text x="534" y="304" fill="#737373" font-size="11.5">child pages follow their parent</text>

  <!-- context 2 -->
  <rect x="722" y="168" width="190" height="150" rx="10" fill="#171717" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="738" y="182" width="22" height="18" rx="4" fill="#22c55e"/>
  <text x="745" y="196" fill="#0a0a0a" font-size="12" font-weight="700">2</text>
  <text x="768" y="196" fill="#22c55e" font-size="13" font-weight="600">Context 2</text>
  <rect x="738" y="212" width="158" height="30" rx="7" fill="#202020" stroke="#404040"/>
  <text x="752" y="232" fill="#e5e5e5" font-size="12.5">Tab: account B</text>
  <text x="738" y="272" fill="#a3a3a3" font-size="12">same site, other login -</text>
  <text x="738" y="290" fill="#a3a3a3" font-size="12">side by side</text>

  <text x="518" y="346" fill="#a3a3a3" font-size="12.5">The number badge in the sidebar shows the context.</text>
  <text x="518" y="368" fill="#a3a3a3" font-size="12.5">"Open link in new tab" keeps the parent's context;</text>
  <text x="518" y="388" fill="#a3a3a3" font-size="12.5">only "+" makes a new one.</text>
  <text x="518" y="420" fill="#737373" font-size="12">Folder: one per context</text>
</svg>
