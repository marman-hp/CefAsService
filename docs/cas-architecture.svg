<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#0a0a0a"/>
  <text x="32" y="44" fill="#e5e5e5" font-size="20" font-weight="600">How CAS fits together</text>
  <text x="32" y="68" fill="#8a94a3" font-size="13">One worker process (a real Chromium) per tenant - the viewer only sees a video stream and sends input.</text>

  <!-- Server machine frame -->
  <rect x="300" y="96" width="628" height="392" rx="12" fill="#111111" stroke="#262626" stroke-dasharray="6 5"/>
  <text x="318" y="120" fill="#737373" font-size="12" letter-spacing="1">SERVER (Windows)</text>

  <!-- Viewer -->
  <rect x="32" y="200" width="220" height="150" rx="10" fill="#171717" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="230" fill="#e5e5e5" font-size="16" font-weight="600">Viewer</text>
  <text x="52" y="252" fill="#a3a3a3" font-size="12.5">Any browser: PC, phone, tablet</text>
  <text x="52" y="276" fill="#a3a3a3" font-size="12.5">/broker page (desktop)</text>
  <text x="52" y="296" fill="#a3a3a3" font-size="12.5">mobile viewer (phones)</text>
  <text x="52" y="324" fill="#3b82f6" font-size="12.5">video + audio in, input out</text>

  <!-- Admin -->
  <rect x="330" y="140" width="220" height="96" rx="10" fill="#171717" stroke="#404040"/>
  <text x="350" y="168" fill="#e5e5e5" font-size="16" font-weight="600">Admin</text>
  <text x="350" y="190" fill="#a3a3a3" font-size="12.5">Settings, start / stop / restart</text>
  <text x="350" y="210" fill="#a3a3a3" font-size="12.5">Loopback only, password</text>

  <!-- Broker -->
  <rect x="330" y="290" width="220" height="140" rx="10" fill="#171717" stroke="#404040"/>
  <text x="350" y="318" fill="#e5e5e5" font-size="16" font-weight="600">Broker</text>
  <text x="350" y="340" fill="#a3a3a3" font-size="12.5">Serves the viewer page (HTTPS)</text>
  <text x="350" y="360" fill="#a3a3a3" font-size="12.5">Starts one worker per tenant</text>
  <text x="350" y="380" fill="#a3a3a3" font-size="12.5">Routes viewers to their worker</text>
  <text x="350" y="400" fill="#a3a3a3" font-size="12.5">Relay mode: carries the stream</text>

  <!-- Workers -->
  <rect x="640" y="150" width="260" height="96" rx="10" fill="#171717" stroke="#404040"/>
  <text x="660" y="178" fill="#e5e5e5" font-size="16" font-weight="600">Worker - tenant A</text>
  <text x="660" y="200" fill="#a3a3a3" font-size="12.5">Chromium (CEF), its tabs</text>
  <text x="660" y="220" fill="#a3a3a3" font-size="12.5">Video encoder + Opus audio</text>

  <rect x="640" y="266" width="260" height="96" rx="10" fill="#171717" stroke="#404040"/>
  <text x="660" y="294" fill="#e5e5e5" font-size="16" font-weight="600">Worker - tenant B</text>
  <text x="660" y="316" fill="#a3a3a3" font-size="12.5">Separate process, profile, cache</text>
  <text x="660" y="336" fill="#a3a3a3" font-size="12.5">Crash stays in this tenant</text>

  <rect x="640" y="382" width="260" height="56" rx="10" fill="#141414" stroke="#262626" stroke-dasharray="4 4"/>
  <text x="660" y="415" fill="#737373" font-size="13">... one more per tenant</text>

  <!-- broker.db -->
  <rect x="330" y="446" width="220" height="30" rx="8" fill="#141414" stroke="#262626"/>
  <text x="350" y="466" fill="#a3a3a3" font-size="12">broker.db - settings shared by all three</text>

  <!-- Arrows -->
  <path d="M440 236 L440 288" stroke="#8a94a3" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="448" y="268" fill="#737373" font-size="11.5">starts / stops</text>

  <path d="M252 300 L328 336" stroke="#3b82f6" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="258" y="292" fill="#3b82f6" font-size="11.5">open /broker</text>

  <path d="M550 340 L638 210" stroke="#8a94a3" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M550 360 L638 314" stroke="#8a94a3" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="566" y="256" fill="#737373" font-size="11.5">spawns</text>

  <path d="M252 230 C 420 110, 560 120, 638 176" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="410" y="126" fill="#3b82f6" font-size="11.5">port mode: stream straight to the worker</text>
</svg>
